name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter --version
          flutter create --platforms=android --org tw.lifemilestones --project-name life_milestones .
          rm -rf test
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="生涯里程"/' $M
          sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>/' $M
          # local_auth 需要 FlutterFragmentActivity
          MA=$(find android/app/src/main -name 'MainActivity.*')
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/; s/: FlutterActivity()/: FlutterFragmentActivity()/; s/extends FlutterActivity/extends FlutterFragmentActivity/' $MA
          cat $MA
          sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>#' $M
          cat $M
          # Android lint 在 image_picker 上會當掉（工具本身的 bug），release 打包時跳過 lintVital
          G=android/build.gradle.kts; [ -f $G ] || G=android/build.gradle
          printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.contains("lintVital")) { enabled = false }\n    }\n}\n' >> $G
          tail -8 $G

      # 簽章金鑰放在 GitHub Secrets（SIGNING_KEYSTORE_BASE64），不在程式碼裡。
      # 沒設定時（例如別人 fork）會用 Gradle 自動產生的金鑰，一樣能打包。
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
            echo "Using release signing key from secrets"
          else
            echo "No signing secret: using a temporary key"
          fi

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk LifeMilestones-v1.2.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LifeMilestones-apk
          path: LifeMilestones-v1.2.${{ github.run_number }}.apk

      - name: Publish release
        # 只有用正式金鑰簽章時才發佈 Release，避免大家裝到之後無法更新的版本
        if: github.repository == 'Broooooook/life-milestones' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 生涯里程 v1.2.${{ github.run_number }}
          files: LifeMilestones-v1.2.${{ github.run_number }}.apk
          body: 自動打包。手機上下載 APK 安裝即可；新版會直接覆蓋舊版，資料保留。
